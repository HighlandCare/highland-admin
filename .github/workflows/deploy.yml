name: Deploy to EC2

on:
  push:
    branches: [highland-dahsboard]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Load nvm so npm/pm2 are on PATH in this non-login shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/deploy/highland-care/highland-backend
            git pull
            for d in cura-main cura-chat cura-driver; do
              (cd "$d" && npm i)
            done
            pm2 restart ecosystem.config.js
